<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catch the Bone</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

.game-wrapper {
    text-align: center;
    width: 100%;
}

/* TOP UI */
.game-title {
    color: white;
    font-size: 32px;
    margin-bottom: 12px;
}

.level-container {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 14px;
}

.level-button {
    padding: 8px 18px;
    border-radius: 25px;
    border: none;
    background: #4CAF50;
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.level-button.active {
    background: white;
    color: #4CAF50;
}

/* GAME CONTAINER */
.container {
    width: min(90vw, 420px);
    height: min(70vh, 560px);
    margin: auto;
    background: linear-gradient(180deg, #1aff8c, #00b894);
    border-radius: 20px;
    border: 4px solid white;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

/* HUD */
.scoreboard, .lives {
    position: absolute;
    top: 12px;
    background: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    z-index: 5;
}

.scoreboard { left: 12px; }
.lives { right: 12px; }

/* GAME OBJECTS */
.dog {
    position: absolute;
    bottom: 8px;
    font-size: 40px;
}
.dog::before { content: "🐶"; }

.bone {
    position: absolute;
    top: 0;
    font-size: 34px;
}
.bone::before { content: "🦴"; }

/* GAME OVER */
.game-over {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 24px;
    z-index: 10;
}

.restart-button {
    margin-top: 16px;
    padding: 10px 22px;
    border-radius: 25px;
    border: none;
    background: #ff4b2b;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

/* START SCREEN */
#startScreen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 15;
}

/* CONTROLS */
.controls {
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 16px;
}

button.control {
    padding: 14px 28px;
    font-size: 18px;
    border-radius: 30px;
    border: none;
    color: white;
    cursor: pointer;
}

.left { background: #ff4b2b; }
.right { background: #1d976c; }

/* RESPONSIVE */
@media (max-width: 600px) {
    .game-title { font-size: 24px; }
    .dog { font-size: 34px; }
    .bone { font-size: 28px; }
}
</style>
</head>

<body>

<div class="game-wrapper">

<h1 class="game-title">Catch the Bone</h1>

<div class="level-container">
    <button class="level-button" onclick="setLevel('easy', this)">Easy</button>
    <button class="level-button" onclick="setLevel('medium', this)">Medium</button>
    <button class="level-button" onclick="setLevel('hard', this)">Hard</button>
</div>

<div class="container" id="container">
    <div class="scoreboard" id="score">Score: 0</div>
    <div class="lives" id="lives">❤️❤️❤️</div>

    <div class="dog" id="dog"></div>
    <div class="bone" id="bone"></div>

    <div class="game-over" id="gameOver">
        Game Over 😢
        <button class="restart-button" onclick="restartGame()">Restart</button>
    </div>

    <div id="startScreen">
        <h2>Welcome!</h2>
        <button class="restart-button" onclick="startGame()">Start</button>
    </div>
</div>

<div class="controls">
    <button class="control left" onclick="moveLeft()">Left</button>
    <button class="control right" onclick="moveRight()">Right</button>
</div>

</div>

<script>
const container = document.getElementById("container");
const dog = document.getElementById("dog");
const bone = document.getElementById("bone");

let dogX = 0;
let boneY = 0;
let boneX = 0;
let speed = 1.5;
let score = 0;
let lives = 3;
let gameOver = false;

function setLevel(level, btn) {
    speed = level === "easy" ? 1.2 : level === "medium" ? 2 : 3;
    document.querySelectorAll(".level-button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}

function randomBone() {
    boneY = 0;
    boneX = Math.random() * (container.clientWidth - 40);
    bone.style.left = boneX + "px";
}

function moveBone() {
    if (gameOver) return;

    boneY += speed;
    bone.style.top = boneY + "px";

    const d = dog.getBoundingClientRect();
    const b = bone.getBoundingClientRect();

    if (d.left < b.right && d.right > b.left && d.top < b.bottom && d.bottom > b.top) {
        score++;
        document.getElementById("score").innerText = "Score: " + score;
        randomBone();
    }

    if (boneY > container.clientHeight - 40) {
        lives--;
        document.getElementById("lives").innerText = "❤️".repeat(lives);
        randomBone();
        if (lives === 0) endGame();
    }

    requestAnimationFrame(moveBone);
}

function moveLeft() {
    dogX = Math.max(0, dogX - container.clientWidth * 0.08);
    dog.style.left = dogX + "px";
}

function moveRight() {
    dogX = Math.min(container.clientWidth - 40, dogX + container.clientWidth * 0.08);
    dog.style.left = dogX + "px";
}

function endGame() {
    gameOver = true;
    document.getElementById("gameOver").style.display = "flex";
}

function restartGame() {
    score = 0;
    lives = 3;
    gameOver = false;
    dogX = container.clientWidth / 2;
    dog.style.left = dogX + "px";
    document.getElementById("score").innerText = "Score: 0";
    document.getElementById("lives").innerText = "❤️❤️❤️";
    document.getElementById("gameOver").style.display = "none";
    randomBone();
    moveBone();
}

function startGame() {
    document.getElementById("startScreen").style.display = "none";
    restartGame();
}

/* Keyboard */
document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") moveLeft();
    if (e.key === "ArrowRight") moveRight();
});

/* Swipe Support */
let touchStartX = 0;
container.addEventListener("touchstart", e => {
    touchStartX = e.touches[0].clientX;
});
container.addEventListener("touchend", e => {
    let diff = e.changedTouches[0].clientX - touchStartX;
    if (diff < 0) moveLeft();
    else moveRight();
});
</script>

</body>
</html>
